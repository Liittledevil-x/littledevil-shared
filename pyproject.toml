[project]
name = "littledevil-shared"
version = "0.1.0"
description = "Shared database migrations and contracts for LittleDevil."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
littledevil-migrate = "littledevil_shared.migrate:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littledevil_shared"]
